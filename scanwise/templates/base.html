<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ScanWise - Medical Barcode & Scanner Diagnostic Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/diagnostics.css') }}">
</head>
<body>
    <header class="app-header">
        <div class="header-brand">
            <h1>ScanWise</h1>
            <span class="badge badge-subtle">Medical Scanner Diagnostics</span>
        </div>
        <div class="header-controls">
            <label for="profile-select">EMR Profile:</label>
            <select id="profile-select" class="profile-dropdown">
                {% for pid, pdata in profiles.items() %}
                <option value="{{ pid }}">{{ pdata.name }}</option>
                {% endfor %}
            </select>
        </div>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>ScanWise Diagnostic Tool &bull; Zero-Install Technician Suite</p>
    </footer>

    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    <script src="{{ url_for('static', filename='js/wedge.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
