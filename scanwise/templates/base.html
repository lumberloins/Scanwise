<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ScanWise{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/diagnostics.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/scan.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tech.css') }}">
    {% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <header class="app-header">
        <div class="header-brand">
            <h1>ScanWise</h1>
            <nav class="mode-nav" data-scan-ignore>
                <a href="{{ url_for('views.tech') }}" class="{{ 'active' if mode == 'tech' }}">Tech Mode</a>
                <a href="{{ url_for('views.engineering') }}" class="{{ 'active' if mode == 'engineering' }}">Engineering Mode</a>
            </nav>
        </div>
        <div class="header-controls" data-scan-ignore>
            {% block header_controls %}{% endblock %}
        </div>
    </header>

    <main class="app-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <p>ScanWise Medical Scanner Diagnostics</p>
    </footer>

    <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
